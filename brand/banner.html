<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:400px;overflow:hidden;background:#04060A;font-family:'Chakra Petch',sans-serif}
  #stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(135% 150% at 50% -15%,#0B1428 0%,#070A16 48%,#04060A 85%)}
  canvas#rain{position:absolute;inset:0;opacity:.5}
  #hex{position:absolute;inset:0;opacity:.14;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='48'><path d='M14 0 L42 0 L56 24 L42 48 L14 48 L0 24 Z' fill='none' stroke='%235AA0FF' stroke-width='1'/></svg>");
    background-size:56px 48px}
  #floor{position:absolute;left:-50%;right:-50%;bottom:-160px;height:520px;transform:perspective(900px) rotateX(77deg);transform-origin:50% 100%;
    background-image:linear-gradient(rgba(60,160,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(60,160,255,.35) 1px,transparent 1px);
    background-size:60px 60px;-webkit-mask-image:linear-gradient(0deg,transparent,#000 62%);opacity:.4}
  .glow{position:absolute;border-radius:50%;filter:blur(140px)}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 120% at 50% 45%,transparent 52%,rgba(0,0,0,.68) 100%)}

  #lockup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .chip{font:700 14px 'JetBrains Mono',monospace;letter-spacing:.42em;color:#58E0FF;text-transform:uppercase;text-shadow:0 0 16px rgba(0,229,255,.6)}
  .row{display:flex;align-items:center;gap:6px}
  #probe{font-weight:700;font-size:150px;letter-spacing:-.01em;line-height:.8;color:#fff;
    text-shadow:0 0 2px #fff,0 0 22px rgba(90,170,255,.55),0 0 48px rgba(61,123,255,.35);position:relative}
  #reticle{width:150px;height:150px;margin-left:-6px}
  #reticle svg{display:block;overflow:visible}
  .tag{font:500 23px 'JetBrains Mono',monospace;color:#B7C4EC;margin-top:14px;letter-spacing:.01em}
  .tag b{color:#58E0FF}
  .term{font:700 15px 'JetBrains Mono',monospace;color:#5a7;letter-spacing:.04em;margin-top:6px;color:#59C78A}
  .term .c{color:#4a5578}.term .n{color:#FF5568}
</style></head>
<body><div id="stage">
  <div id="hex"></div>
  <canvas id="rain" width="1200" height="400"></canvas>
  <div id="floor"></div>
  <i class="glow" style="width:520px;height:520px;left:150px;top:-160px;background:#0E8FE0;opacity:.26"></i>
  <i class="glow" style="width:520px;height:520px;right:150px;top:40px;background:#7B2CF5;opacity:.26"></i>

  <div id="lockup">
    <div class="chip">· AI AGENT SECURITY SCANNER ·</div>
    <div class="row">
      <div id="probe">probe</div>
      <div id="reticle"><svg viewBox="0 0 120 120">
        <defs>
          <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#7FB2FF"/></linearGradient>
          <filter id="gl" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- the "0": bold white ring -->
        <circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="12" filter="url(#gl)"/>
        <!-- HUD target-lock corner brackets -->
        <g id="brackets" stroke="url(#cy)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#gl)">
          <path d="M20 8 H8 V20"/><path d="M100 8 H112 V20"/><path d="M20 112 H8 V100"/><path d="M100 112 H112 V100"/>
        </g>
        <!-- crosshair -->
        <g stroke="#9FE0FF" stroke-width="3" stroke-linecap="round" opacity=".9"><line x1="60" y1="24" x2="60" y2="34"/><line x1="60" y1="86" x2="60" y2="96"/><line x1="24" y1="60" x2="34" y2="60"/><line x1="86" y1="60" x2="96" y2="60"/></g>
        <!-- rotating scan arc -->
        <g id="arc"><path d="M60 24 A36 36 0 0 1 96 60" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#gl)" opacity=".95"/></g>
        <!-- center node + lock flash -->
        <circle id="lock" cx="60" cy="60" r="12" fill="none" stroke="#FF3B5C" stroke-width="3" opacity="0"/>
        <circle cx="60" cy="60" r="6" fill="url(#cy)" filter="url(#gl)"/><circle cx="60" cy="60" r="2.6" fill="#fff"/>
      </svg></div>
    </div>
    <div class="tag">Find the weaknesses in your AI — <b>before attackers do.</b></div>
    <div class="term"><span class="c">&gt;</span> scanning agent… <span class="c">·</span> threats found: <span class="n" id="cnt">0</span></div>
  </div>

  <div id="scan"></div><div id="vig"></div>
</div>
<script>
  // code rain (fixed chars per column so it doesn't flicker; just scrolls)
  var cv=document.getElementById('rain'),cx=cv.getContext('2d');
  var cols=[],CW=38,HEX='0123456789ABCDEF<>/{}$#*';
  for(var x=6;x<1200;x+=CW){var s='';for(var k=0;k<22;k++)s+=HEX[(Math.random()*HEX.length)|0];cols.push({x:x,chars:s,sp:0.5+Math.random()*0.8,off:Math.random()*400});}
  function rain(t){cx.clearRect(0,0,1200,400);cx.font="15px 'JetBrains Mono',monospace";
    cols.forEach(function(c){for(var i=0;i<c.chars.length;i++){var y=((c.off+t*400*c.sp+i*22)%440)-20;var a=Math.max(0,0.16-i*0.006);cx.fillStyle='rgba(90,200,255,'+a.toFixed(3)+')';cx.fillText(c.chars[i],c.x,y);}});}

  var arcAngle=0;
  window.__setTime=function(t){
    rain(t);
    arcAngle=t*360*2;
    document.getElementById('arc').setAttribute('transform','rotate('+arcAngle+' 60 60)');
    document.getElementById('brackets').setAttribute('transform','rotate('+(-t*40)+' 60 60)');
    // lock flash + counter tick as the scan "finds" threats
    var phase=(t*9)%1, found=Math.min(9,Math.floor(t*9)+1);
    document.getElementById('cnt').textContent=found;
    var lf=Math.max(0,1-phase*4); document.getElementById('lock').setAttribute('opacity',(lf*0.9).toFixed(2));
    document.getElementById('lock').setAttribute('r',(10+phase*10).toFixed(1));
  };
  window.__ready=document.fonts.ready.then(function(){return new Promise(function(r){setTimeout(r,250)})});
</script>
</body></html>
